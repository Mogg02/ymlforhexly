---
functional:
  - Пользователь может просматривать каталог товаров.
  - Пользователь может искать товары по ключевому слову.
  - Пользователь может фильтровать товары.
  - Пользователь может просматривать информацию о товаре.
  - Пользователь может видеть рейтинг товара.
  - Пользователь может видеть цену со скидкой и без скидки.
  - Пользователь может добавлять товары в корзину.
  - Пользователь может просматривать содержимое корзины.
  - Пользователь может удалять товары из корзины.
  - Пользователь может продолжить выбирать товары из корзины.
  - Пользователь может оформить заказ с переходом к оплате.
  - Пользователь может переключать язык интерфейса.
  - Интерфейс доступен на русском и английском языках.
non-functional:
  - Интерфейс адаптируется к мобильным устройствам.
  - Приложение работает как SPA без полной перезагрузки страниц при обычной навигации.
  - Приложение оптимизировано для скорости работы.
  - Приложение защищает данные пользователя.
  - Приложение совместимо с актуальными версиями популярных браузеров.
  - Приложение способно обрабатывать большое количество трафика.
  - Сайт доступен с различных устройств.
  - Сайт доступен напрямую из интернета без VPN.
implicit:
  - Если пользователь добавляет один товар в корзину впервые, количество должно быть равно 1.
  - После удаления товара он должен исчезнуть из корзины.
  - Итоговая стоимость корзины должна соответствовать количеству и ценам товаров.
  - При обновлении страницы содержимое корзины должно сохраняться в рамках сессии браузера.
  - Поиск без совпадений должен показывать понятное сообщение или пустое состояние.
  - Элементы управления должны иметь понятные названия и быть доступны для нажатия.
  - При переключении языка текст интерфейса должен меняться на выбранный язык.
