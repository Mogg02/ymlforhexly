---
- summary: Проверка загрузки каталога товаров
  requirement: Пользователь может просматривать каталог товаров
  prerequisites: Открыта главная страница магазина
  test-data: Не требуется
  steps:
    - Открыть https://hexlet.app
  expected-result: Каталог загружается, товары и элементы интерфейса отображаются

- summary: Проверка поиска существующего товара по названию
  requirement: Пользователь может искать товары по ключевому слову
  prerequisites: Открыта страница каталога
  test-data: Essence Mascara Lash Princess
  steps:
    - Ввести название товара в поле поиска
  expected-result: В результатах отображается соответствующий товар

- summary: Проверка очистки поискового запроса
  requirement: Пользователь должен иметь возможность сбросить поиск
  prerequisites: В поле поиска введен текст
  test-data: Текст "Essence"
  steps:
    - Очистить поле ввода поиска (или нажать крестик/кнопку сброса)
  expected-result: Поле поиска становится пустым, каталог отображает все товары

- summary: Проверка добавления товара в корзину
  requirement: Пользователь может добавлять товары в корзину
  prerequisites: Открыта страница каталога
  test-data: Essence Mascara Lash Princess
  steps:
    - Найти товар в каталоге
    - Нажать кнопку добавления в корзину
    - Открыть корзину
  expected-result: Выбранный товар отображается в корзине, количество равно 1

- summary: Проверка удаления товара из корзины
  requirement: Пользователь может удалять товары из корзины
  prerequisites: В корзине есть хотя бы один товар
  test-data: Любой добавленный товар
  steps:
    - Открыть корзину
    - Нажать кнопку удаления у товара
  expected-result: Товар исчезает из корзины

- summary: Проверка перехода из корзины к дальнейшему выбору товаров
  requirement: Пользователь может продолжить выбирать товары из корзины
  prerequisites: Открыта корзина
  test-data: Не требуется
  steps:
    - Нажать кнопку продолжения покупок, если она доступна
  expected-result: Пользователь возвращается к каталогу товаров

- summary: Проверка отображения цены со скидкой и без скидки
  requirement: В каталоге отображаются цена со скидкой и первоначальная цена
  prerequisites: Открыта страница каталога
  test-data: Essence Mascara Lash Princess
  steps:
    - Найти карточку товара
  expected-result: Отображаются текущая цена и первоначальная цена, если для товара предусмотрена скидка

- summary: Проверка фильтрации товаров по категории
  requirement: Пользователь может фильтровать товары
  prerequisites: Открыта страница каталога
  test-data: Доступные параметры фильтрации
  steps:
    - Выбрать одну из доступных категорий
  expected-result: В каталоге остаются товары, соответствующие выбранному фильтру

- summary: Проверка сброса выбранных фильтров
  requirement: Пользователь должен иметь возможность вернуть полный каталог товаров
  prerequisites: Выбран фильтр категории или бренда
  test-data: Активный фильтр
  steps:
    - Нажать на кнопку или ссылку сброса фильтров
  expected-result: Фильтры деактивируются, отображается исходный список товаров

- summary: Проверка сохранения корзины после обновления страницы
  requirement: Корзина хранится в сессии браузера
  prerequisites: В корзине есть хотя бы один товар
  test-data: Любой добавленный товар
  steps:
    - Обновить страницу браузера
    - Открыть корзину
  expected-result: Содержимое корзины сохраняется в рамках сессии

- summary: Проверка переключения языка интерфейса
  requirement: Пользователь может переключить язык интерфейса
  prerequisites: Открыта страница магазина
  test-data: Доступные языки интерфейса
  steps:
    - Переключить язык интерфейса
  expected-result: Текст интерфейса отображается на выбранном языке

- summary: Проверка навигации без полной перезагрузки страницы (SPA)
  requirement: Магазин функционирует как SPA-приложение
  prerequisites: Открыта главная страница
  test-data: Элементы пагинации (страницы каталога)
  steps:
    - Нажимать кнопки страниц Next / Previous для перехода по каталогу
  expected-result: Переход между страницами происходит мгновенно, без полной перезагрузки страницы (вкладки) в браузере, структура интерфейса (включая боковое меню категорий) стабильна
