---
- summary: Исчезает боковое меню со списком категорий при переключении страниц каталога
  environment: |
    Браузер: Google Chrome (последняя стабильная версия)
    ОС: Windows
    Сайт: https://hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу магазина https://hexlet.app
    2. Найти блок фильтров "Category" слева от списка товаров.
    3. Перейти на следующую страницу каталога товаров, нажав кнопку "Next" внизу страницы.
    4. Вернуться назад, нажав кнопку "Previous", либо продолжить перекликивание страниц.
  expected-result: |
    Переход между страницами выполняется корректно в рамках SPA-архитектуры. Блок фильтров "Category" остается видимым и доступным для взаимодействия на любой странице каталога.
  actual-result: |
    При переключении страниц каталога блок со списком категорий нестабилен: он полностью исчезает из интерфейса при переходе вперед/назад, из-за чего пользователь теряет возможность фильтровать товары.

- summary: Отсутствует возможность сброса выбранных фильтров и очистки поискового запроса
  environment: |
    Браузер: Google Chrome (последняя стабильная версия)
    ОС: Windows
    Сайт: https://hexlet.app
  steps-to-reproduce: |
    1. Открыть интернет-магазин.
    2. Ввести в поле поиска любой поисковый запрос (или применить фильтр).
    3. Попытаться сбросить введенные данные для возврата к полному каталогу.
  expected-result: |
    В интерфейсе присутствует кнопка сброса фильтров/поиска (или крестик удаления текста в инпуте), нажатие на которую возвращает исходное состояние каталога.
  actual-result: |
    Элементы сброса/очистки отсутствуют, пользователю приходится полностью перезагружать страницу вручную для сброса состояния.
